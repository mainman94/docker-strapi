# Local checks for the Strapi image repo.
#
# A push to release-versions/ publishes both image variants to Docker Hub and
# cuts a GitHub release, so a typo here ships. These hooks run what CI's lint
# job runs, plus a format check on the files that trigger a publish.
#
# The build and smoke test stay in CI and in `make smoke` — they need a Docker
# daemon and a few minutes.
#
# Install once:  make hooks
# Run manually:  make lint
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
        # devcontainer.json is JSONC by spec — the format allows the
        # comments explaining each feature, which a strict JSON parser
        # will not accept.
        exclude: ^\.devcontainer/
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # hadolint-py, not the upstream hadolint repo: it wraps the binary in a
  # wheel, so the hook needs no Docker daemon. Same config and threshold as
  # the lint job in .github/workflows/ci.yml.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [--config, .hadolint.yaml, --failure-threshold, warning]

  # Same flags as CI: SC2086 and SC2269 are suppressed there too.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=warning, -e, SC2086, -e, SC2269]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-src
        args: [-i, "2", -ci]

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: entrypoints-identical
        name: entrypoints must stay identical across variants
        entry: scripts/check-entrypoints-identical.sh
        language: script
        files: ^images/strapi-(alpine|debian)/docker-entrypoint\.sh$
        pass_filenames: false

      - id: release-versions-format
        name: release-versions files are well formed
        entry: scripts/check-release-versions.sh
        language: script
        files: ^release-versions/
        pass_filenames: false
