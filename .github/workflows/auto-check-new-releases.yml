###################
# PAT: secret PAT in the `release` environment, not GITHUB_TOKEN. A pull
# request opened with GITHUB_TOKEN does not trigger ci.yml, so the required
# checks would never report and auto-merge would never fire; the merge it
# enables also has to trigger publish-docker-images.yml, which a
# GITHUB_TOKEN-driven merge would not. Needs contents:write and
# pull-requests:write on this repository only. Cloudflare Bot Fight Mode
# blocks GitHub Actions runners from reaching vault.hauptmann.dev, so the
# OpenBao OIDC route doesn't work here.
#
# Nothing here pushes to main. A version or digest change becomes a pull
# request on release/auto that has to pass the same required checks as any
# other change; auto-merge lands it, and that merge triggers the publish.
###################

name: Check for new releases
# Check automatically for new releases (new version)

permissions:
  contents: read # the branch and the pull request go through the PAT

on:
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:

# One release PR at a time: a run while the last one is still open updates it.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PAT lives in the release environment, which only main can use.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Validate before writing: a failed request or a changed payload would
      # otherwise put an empty value or "null" into release-versions/, and the
      # resulting release builds create-strapi-app@null.
      # The version comes from npm's `latest` dist-tag, not from Strapi's main
      # branch: main can carry a version that is not on npm yet, and the image
      # scaffolds with create-strapi-app@<version> from npm at first boot.
      - name: Fetch release version
        id: fetch-version
        run: |
          version=$(curl -sSfL https://registry.npmjs.org/@strapi/strapi/latest | jq -er ".version")
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected strapi version: '$version'"; exit 1 ;;
          esac
          echo "$version" > release-versions/strapi-latest.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch node base image digests
        run: |
          for entry in "24-alpine:node-alpine-digest.txt" "24-trixie-slim:node-debian-digest.txt"; do
            tag=${entry%%:*}
            file=${entry#*:}
            digest=$(curl -sSfL "https://hub.docker.com/v2/repositories/library/node/tags/$tag" | jq -er ".digest")
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::unexpected digest for node:$tag: '$digest'"; exit 1 ;;
            esac
            echo "$digest" > "release-versions/$file"
          done

      # No change → no pull request (pull-request-operation is "none").
      - name: Open or update the release pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }}
          branch: release/auto
          delete-branch: true
          add-paths: release-versions/*
          commit-message: New auto release v${{ steps.fetch-version.outputs.version }}
          title: New auto release v${{ steps.fetch-version.outputs.version }}
          body: |
            Automated by `auto-check-new-releases.yml`: the latest Strapi version on npm and the current `node:24` base image digests.

            Merging publishes both variants to Docker Hub. Auto-merge lands this once the required checks pass.

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
