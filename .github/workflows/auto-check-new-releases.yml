###################
# PAT: repo secret PAT (user-scoped, repo+workflow), not GITHUB_TOKEN — a
# GITHUB_TOKEN-triggered push does not cascade into other workflow runs, and
# this commit needs to trigger publish-docker-images.yml. Cloudflare Bot
# Fight Mode blocks GitHub Actions runners from reaching vault.hauptmann.dev,
# so the OpenBao OIDC route doesn't work here.
###################

name: Check for new releases
# Check automatically for new releases (new version)

on:
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        id: fetch-version
        run: |
          curl -sL https://raw.githubusercontent.com/strapi/strapi/main/packages/core/strapi/package.json | jq -r ".version" > release-versions/strapi-latest.txt
          echo "version=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Fetch node base image digests
        run: |
          curl -sL "https://hub.docker.com/v2/repositories/library/node/tags/24-alpine" | jq -r ".digest" > release-versions/node-alpine-digest.txt
          curl -sL "https://hub.docker.com/v2/repositories/library/node/tags/24-trixie-slim" | jq -r ".digest" > release-versions/node-debian-digest.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: New auto release v${{steps.fetch-version.outputs.version}}
