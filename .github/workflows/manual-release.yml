###################
# ENV VARS:
# - PAT (generated at Personal Access Tokens - with workflow access checked)
###################

name: Create new release manually

permissions:
  contents: read # the push goes through the PAT stored by actions/checkout

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: '5.0.0'
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      # The PAT has to stay in the checkout's git config: git-auto-commit-action
      # pushes with it, and that push has to trigger publish-docker-images.yml,
      # which a GITHUB_TOKEN push would not do.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true

      # The input goes through the environment, never interpolated into the
      # shell: `${{ }}` inside a run block is a template injection sink.
      # It is validated to the same bare-semver shape the
      # release-versions-format hook enforces, because writing this file
      # triggers publish-docker-images.yml — a typo here publishes an image
      # built from create-strapi-app@<typo>.
      - name: Fetch release version
        id: fetch-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must be a bare semver like 5.0.0, got '$VERSION'"; exit 1 ;;
          esac
          echo "$VERSION" > release-versions/strapi-latest.txt

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: New manual release ${{ inputs.version }}
