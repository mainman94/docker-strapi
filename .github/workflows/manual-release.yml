###################
# ENV VARS:
# - PAT (generated at Personal Access Tokens - with workflow access checked)
###################

name: Create new release manually

permissions:
  contents: read # the push goes through the PAT stored by actions/checkout

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: '5.0.0'
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        id: fetch-version
        run: |
          echo "${{ github.event.inputs.version }}" > release-versions/strapi-latest.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: New manual release ${{ github.event.inputs.version }}