###################
# ENV VARS:
# - PAT in the `release` environment (see auto-check-new-releases.yml)
#
# Opens a release pull request, like the daily check; it does not push to
# main. Auto-merge lands it once the required checks pass.
###################

name: Create new release manually

permissions:
  contents: read # the branch and the pull request go through the PAT

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: '5.0.0'
        type: string

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PAT lives in the release environment, which only main can use.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The input goes through the environment, never interpolated into the
      # shell: `${{ }}` inside a run block is a template injection sink.
      # It is validated to the same bare-semver shape the
      # release-versions-format hook enforces, because merging this file
      # triggers publish-docker-images.yml — a typo here publishes an image
      # built from create-strapi-app@<typo>.
      - name: Fetch release version
        id: fetch-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must be a bare semver like 5.0.0, got '$VERSION'"; exit 1 ;;
          esac
          echo "$VERSION" > release-versions/strapi-latest.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Everything below uses the validated output, not the raw input.
      - name: Open or update the release pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }}
          branch: release/manual
          delete-branch: true
          add-paths: release-versions/*
          commit-message: New manual release ${{ steps.fetch-version.outputs.version }}
          title: New manual release ${{ steps.fetch-version.outputs.version }}
          body: |
            Started by hand with `manual-release.yml`.

            Merging publishes both variants to Docker Hub. Auto-merge lands this once the required checks pass.

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
