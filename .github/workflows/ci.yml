name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/strapi-${{ matrix.variant }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning -e SC2086,SC2269 \
            smoke-test.sh images/strapi-${{ matrix.variant }}/docker-entrypoint.sh

      - name: Entrypoints must stay identical across variants
        run: diff images/strapi-alpine/docker-entrypoint.sh images/strapi-debian/docker-entrypoint.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading the trivy SARIF to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Build (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./images/strapi-${{ matrix.variant }}
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
            VCS_REF=${{ github.sha }}
          load: true
          tags: strapi-${{ matrix.variant }}-test
          cache-from: type=gha,scope=${{ matrix.variant }}

      - name: Smoke test
        run: ./smoke-test.sh strapi-${{ matrix.variant }}-test

      # These images are public on Docker Hub, so a CVE here is somebody
      # else's problem to inherit. Advisory: the base images are pinned by
      # digest and rebuilt on every upstream Strapi release precisely so a
      # rebuild picks up current patches, and failing the build on an
      # unpatched upstream CVE would only stop that rebuild from shipping.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: strapi-${{ matrix.variant }}-test
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          # Without a per-variant category the two matrix legs overwrite each
          # other's results in the Security tab.
          category: image-${{ matrix.variant }}
