###########
# Docker Hub PAT: repo secret DOCKER_TOKEN (Cloudflare Bot Fight Mode blocks
# GitHub Actions runners from reaching vault.hauptmann.dev, so the OpenBao
# OIDC route doesn't work here). Username is public (Docker Hub namespace),
# not secret.
###########

name: Publish Docker Image

env:
  DOCKER_USERNAME: dockerha08

on:
  push:
    paths:
      - "release-versions/*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current repository
        uses: actions/checkout@v4

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build (default => debian)
        uses: docker/build-push-action@v7
        with:
          context: ./images/strapi-debian
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/strapi:${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_USERNAME }}/strapi:latest

      - name: Build (alpine)
        uses: docker/build-push-action@v7
        with:
          context: ./images/strapi-alpine
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/strapi:alpine-${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_USERNAME }}/strapi:alpine-latest

      - name: Docker Hub Description (README.md)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.DOCKER_USERNAME }}/strapi
          readme-filepath: README.md

      - name: Create Release in GitHub
        id: create_release
        uses: actions/create-release@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{steps.vars.outputs.tag}}
          release_name: Release ${{steps.vars.outputs.tag}}
          body: strapi v${{steps.vars.outputs.tag}}
