###########
# Docker Hub PAT comes from OpenBao (homelab/data/prod/docker, key STRAPI_TOKEN)
# via GitHub Actions OIDC — see homelab/terraform/openbao/github-actions-vault-auth.tf,
# role "gha-docker-strapi". Username is public (Docker Hub namespace), not secret.
###########

name: Publish Docker Image

env:
  DOCKER_USERNAME: dockerha08

on:
  push:
    paths:
      - "release-versions/*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current repository
        uses: actions/checkout@v4

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Get Docker Hub token from OpenBao
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.hauptmann.dev
          method: jwt
          path: github-actions
          role: gha-docker-strapi
          secrets: |
            homelab/data/prod/docker STRAPI_TOKEN | DOCKER_TOKEN

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ steps.vault.outputs.DOCKER_TOKEN }}

      - name: Build (default => debian)
        uses: docker/build-push-action@v7
        with:
          context: ./images/strapi-debian
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/strapi:${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_USERNAME }}/strapi:latest

      - name: Build (alpine)
        uses: docker/build-push-action@v7
        with:
          context: ./images/strapi-alpine
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/strapi:alpine-${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_USERNAME }}/strapi:alpine-latest

      - name: Docker Hub Description (README.md)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ steps.vault.outputs.DOCKER_TOKEN }}
          repository: ${{ env.DOCKER_USERNAME }}/strapi
          readme-filepath: README.md

      - name: Create Release in GitHub
        id: create_release
        uses: actions/create-release@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{steps.vars.outputs.tag}}
          release_name: Release ${{steps.vars.outputs.tag}}
          body: strapi v${{steps.vars.outputs.tag}}
