###########
# Docker Hub PAT: repo secret DOCKER_TOKEN (Cloudflare Bot Fight Mode blocks
# GitHub Actions runners from reaching vault.hauptmann.dev, so the OpenBao
# OIDC route doesn't work here). Username is public (Docker Hub namespace),
# not secret.
#
# Signing needs no secret: cosign signs keylessly against Sigstore using the
# workflow's OIDC identity, so there is no signing key to store, rotate or
# leak. The identity in the signature is this workflow file on this repo.
###########

name: Publish Docker Image

env:
  DOCKER_USERNAME: dockerha08

# Read by default; the two jobs take what they actually need. Only finalize
# writes to the repository, and only build gets an OIDC token.
permissions:
  contents: read

on:
  push:
    paths:
      - "release-versions/*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless signing and provenance both mint an OIDC token; the
      # attestation is written to this repository's attestation store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            context: ./images/strapi-debian
            tag_prefix: debian-slim
          - variant: alpine
            context: ./images/strapi-alpine
            tag_prefix: alpine
    steps:
      - name: Get current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get the version
        id: vars
        run: |
          echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          load: true
          tags: strapi-${{ matrix.variant }}-test
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: ./smoke-test.sh strapi-${{ matrix.variant }}-test

      - name: Build & push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=24
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/strapi:${{ matrix.tag_prefix }}-${{ steps.vars.outputs.tag }}
            ${{ env.DOCKER_USERNAME }}/strapi:${{ matrix.tag_prefix }}-latest
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the multi-arch index by digest, not by tag: a tag can be moved,
      # a digest cannot. Keyless — the signature carries this workflow's
      # identity and lands in the Rekor transparency log, so a consumer can
      # verify that the image came from this repo and nowhere else.
      - name: Sign the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKER_USERNAME}/strapi@${DIGEST}"

      # Build-time provenance in GitHub's attestation store, verifiable with
      # `gh attestation verify`. This is the SLSA statement about *how* the
      # image was built; the buildx `provenance`/`sbom` attestations above
      # travel with the image itself.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: docker.io/${{ env.DOCKER_USERNAME }}/strapi
          subject-digest: ${{ steps.push.outputs.digest }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - name: Get current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Docker Hub Description (README.md)
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.DOCKER_USERNAME }}/strapi
          readme-filepath: README.md

      # actions/create-release is archived; gh ships on the runner. Re-running
      # the workflow for an already-released version must not fail the job.
      - name: Create Release in GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |-
          gh release create "v$TAG" \
            --title "Release $TAG" \
            --notes "Strapi v$TAG

          Images:
          - \`${DOCKER_USERNAME}/strapi:alpine-$TAG\`
          - \`${DOCKER_USERNAME}/strapi:debian-slim-$TAG\`

          Signed keylessly with cosign. Verify:
          \`\`\`
          cosign verify docker.io/${DOCKER_USERNAME}/strapi:alpine-$TAG \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`"
