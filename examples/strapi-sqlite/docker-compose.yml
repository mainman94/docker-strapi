services:
  strapi:
    image: dockerha08/strapi:alpine-latest
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: sqlite
    # Loopback only: these examples run the development server (admin panel
    # with content-type builder and autoreload). Put a reverse proxy in front
    # and switch to NODE_ENV=production before exposing it anywhere else.
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - app:/srv/app # project is scaffolded here on first boot and reused after

volumes:
  app:
