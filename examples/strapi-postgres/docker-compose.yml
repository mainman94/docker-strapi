services:
  strapi:
    image: dockerha08/strapi:alpine-latest
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, e.g. in an .env file next to this compose file}
      DATABASE_SSL: "false"
    # Loopback only: these examples run the development server (admin panel
    # with content-type builder and autoreload). Put a reverse proxy in front
    # and switch to NODE_ENV=production before exposing it anywhere else.
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - app:/srv/app # project is scaffolded here on first boot and reused after
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, e.g. in an .env file next to this compose file}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  data:
  app:
